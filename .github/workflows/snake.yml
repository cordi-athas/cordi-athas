name: matrix snake

on:
  schedule:
    - cron: "0 */12 * * *"   # günde 2 kez yenilenir
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: generate 3d contribution grid
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: generate matrix snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/matrix-snake-dark.svg?color_snake=#00FF41&color_dots=#0D0208,#003B00,#008F11,#00C832,#00FF41
            dist/matrix-snake.svg?color_snake=#008F11&color_dots=#EBEDF0,#9BE9A8,#40C463,#30A14E,#216E39

      - name: fix dist permissions (snk writes as root)
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&bg_color=0D0208&title_color=00FF41&text_color=7CFF9B&icon_color=00FF41&ring_color=00FF41&custom_title=%3E%20operator.stats
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&langs_count=8&bg_color=0D0208&title_color=00FF41&text_color=7CFF9B&custom_title=%3E%20languages.loaded
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: collect outputs
        run: |
          mkdir -p dist/profile-3d-contrib
          cp profile-3d-contrib/*.svg dist/profile-3d-contrib/

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
