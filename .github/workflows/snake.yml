name: matrix snake

on:
  schedule:
    - cron: "0 */12 * * *"   # günde 2 kez yenilenir
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate matrix snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/matrix-snake-dark.svg?color_snake=#00FF41&color_dots=#0D0208,#003B00,#008F11,#00C832,#00FF41
            dist/matrix-snake.svg?color_snake=#008F11&color_dots=#EBEDF0,#9BE9A8,#40C463,#30A14E,#216E39

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
